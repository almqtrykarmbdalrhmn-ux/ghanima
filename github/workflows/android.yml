name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle -p android :app:assembleDebug -PAPI_BASE_URL=${{ vars.API_BASE_URL || 'https://considerate-acceptance-production-867696b9.up.railway.app' }}
      - uses: actions/upload-artifact@v4
        with: { name: honest-reward-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
