<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title>
<body style="font-family:system-ui;max-width:380px;margin:40px auto;padding:0 16px"><h3>Reset password</h3><input id="p" type="password" placeholder="New password (min 8)" style="width:100%;padding:10px"><button onclick="go()" style="margin-top:10px;padding:10px 16px">Save</button><p id="m"></p>
<script>async function go(){const t=new URLSearchParams(location.search).get('token');const r=await fetch('/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,password:p.value})});m.textContent=r.ok?'Password changed. Return to the app.':'Invalid or expired link, or password too short.'}</script></body>
