function L(){S.lang=S.lang=="ar"?"en":"ar";go(S.tab)}
function go(x){S.tab=x;sv_();render()}
function fmt(n){return n.toLocaleString(S.lang=="ar"?"ar-EG":"en-US")}
function addTx(k,a){S.tx.unshift({k:k,a:a,d:new Date().toLocaleString()});S.tx=S.tx.slice(0,30)}
function testAd(){if(!S.user)return needLogin();if(S.ads>=S.limit)return toast(t("lim")+" "+S.limit);S.ads++;S.pts+=10;S.earned+=10;addTx("ad",10);sv_();render()}
function txList(){return S.tx.length?S.tx.map(function(x){return '<div class="row mut" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>'+t(x.k=="ad"?"ad":x.k=="rs"?"rs":"rl")+'</span><b style="color:'+(x.a>0?"var(--ok)":"var(--bad)")+';text-align:end">'+(x.a>0?"+":"")+fmt(x.a)+'</b></div>'}).join(""):'<div class="mut">'+t("none")+'</div>'}
function store(g){var h='<div class="grid">'+PK[g].map(function(p,i){return '<div class="pk">'+ico(g,56)+'<div class="n">'+fmt(p[0])+'</div><div class="p">'+fmt(p[1])+" "+t("pts")+'</div><button onclick="ask(\''+g+'\','+i+')">'+t("redeem")+'</button></div>'}).join("")+'</div>';return h}
function ask(g,i){if(!S.user)return needLogin();var p=PK[g][i];if(S.pts<p[1])return toast(t("low"));
$("dlg").innerHTML='<div class="mask"><div class="card"><b>'+fmt(p[0])+" \u2192 "+fmt(p[1])+" "+t("pts")+'</b><input id="pid" inputmode="numeric" placeholder="'+t("pid")+'"><select id="sv"><option>Middle East</option><option>Europe</option><option>Asia</option><option>Global</option></select><div class="row"><button onclick="sub(\''+g+'\','+i+')">'+t("confirm")+'</button><button class="g" onclick="$(\'dlg\').innerHTML=\'\'">'+t("cancel")+'</button></div></div></div>'}
function sub(g,i){var p=PK[g][i],id=$("pid").value.trim();if(!/^\d{5,15}$/.test(id))return toast(t("badid"));if(S.pts<p[1])return toast(t("low"));
var o={id:"HR-"+Date.now().toString(36).toUpperCase(),g:g,q:p[0],c:p[1],pid:id,srv:$("sv").value,st:"pending"};S.orders.unshift(o);S.pts-=p[1];addTx("rs",-p[1]);$("dlg").innerHTML="";toast(t("ok"));go("orders")}
function setSt(id,st){var o=S.orders.filter(function(x){return x.id==id})[0];if(!o||o.st=="completed"||o.st=="rejected")return;o.st=st;
if(st=="rejected"){S.pts+=o.c;addTx("rl",o.c)}if(st=="completed")S.red+=o.c;go("orders")}
function ordersV(){if(!S.orders.length)return '<div class="card mut">'+t("none")+'</div>';return S.orders.map(function(o){var fin=o.st=="completed"||o.st=="rejected";
return '<div class="card"><div class="row"><b>'+o.id+'</b><span class="st '+o.st+'" style="text-align:center;flex:0 0 auto">'+T[S.lang].s[o.st]+'</span></div><div class="mut">'+ico(o.g,18)+" "+(o.g=="pubg"?"PUBG UC ":"Free Fire ")+fmt(o.q)+" \u00B7 "+fmt(o.c)+" "+t("pts")+'<br>ID: '+o.pid+" \u00B7 "+o.srv+'</div>'+
(S.admin&&!fin?'<div class="row" style="margin-top:8px"><button class="g" onclick="setSt(\''+o.id+'\',\'under_review\')">'+t("rev")+'</button><button class="g" onclick="setSt(\''+o.id+'\',\'processing\')">'+t("proc")+'</button><button onclick="setSt(\''+o.id+'\',\'completed\')">'+t("done")+'</button><button class="g" style="color:var(--bad)" onclick="setSt(\''+o.id+'\',\'rejected\')">'+t("rej")+'</button></div>':"")+'</div>'}).join("")}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=="ar"?"rtl":"ltr";var v="";if(!S.user&&!S.guest){$("app").innerHTML=authV();$("nv").innerHTML="";return}
if(S.tab=="home")v='<div class="tst">'+t("test")+'</div><div class="card"><div class="mut">'+t("bal")+'</div><div class="bal">'+fmt(S.pts)+'</div><div class="row mut"><span>'+t("earned")+": "+fmt(S.earned)+'</span><span>'+t("red")+": "+fmt(S.red)+'</span></div></div><div class="row" style="margin-bottom:12px"><button onclick="go(\'earn\')">'+t("watch")+'</button><button class="g" onclick="go(\'pubg\')">PUBG</button><button class="g" onclick="go(\'ff\')">Free Fire</button></div><div class="card"><b>'+t("recent")+'</b>'+txList()+'</div>';
if(S.tab=="earn")v='<div class="card"><button disabled style="width:100%">'+t("watch")+'</button><p class="mut">'+t("adsOff")+'</p><p class="mut">'+t("lim")+": "+S.ads+" / "+S.limit+'</p><button class="g" style="width:100%" onclick="testAd()">'+t("testAdd")+'</button></div><div class="card"><b>'+t("recent")+'</b>'+txList()+'</div>';
if(S.tab=="pubg")v=store("pubg");if(S.tab=="ff")v=store("ff");if(S.tab=="orders")v=ordersV();
if(S.tab=="me")v='<div class="card"><div class="mut">'+(S.user||t("guestmsg"))+'</div><button class="g" style="width:100%;margin-top:8px" onclick="logout()">'+t(S.user?"logout":"login")+'</button></div><div class="card"><a href="mailto:almqtrykarmbdalrhmn@gmail.com"><button style="width:100%;font-size:16px">'+t("sup")+'</button></a></div><div class="card"><b>'+t("faq")+'</b><p class="mut">'+t("f1")+'</p><p class="mut">'+t("f2")+'</p></div><div class="card"><label class="row"><span>'+t("adm")+'</span><input type="checkbox" '+(S.admin?"checked":"")+' style="flex:0 0 28px" onchange="S.admin=this.checked;sv_()"></label><button class="g" style="width:100%;margin-top:8px" onclick="S.pts=S.earned=S.red=S.ads=0;S.orders=[];S.tx=[];go(\'me\')">'+t("reset")+'</button></div>';
$("app").innerHTML=v;var tabs=[["home","\u2302"],["earn","\u2605"],["pubg","\uD83C\uDFAF"],["ff","\uD83D\uDC8E"],["orders","\uD83D\uDCE6"],["me","\uD83D\uDC64"]];
$("nv").innerHTML=tabs.map(function(x){return '<button class="'+(S.tab==x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')"><i>'+x[1]+'</i>'+t(x[0])+'</button>'}).join("")}
render()
</script></body></html>
